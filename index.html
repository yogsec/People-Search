<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- SEO Meta Tags -->
  <title>People Search | OSINT Tool</title>
  <meta name="description" content="Generate powerful Google dorks to search for people using name and clue. OSINT tool for penetration testers & researchers.">
  <meta name="keywords" content="google dorks, people search, osint, penetration testing, abhinav singwal, yogsec">
  <meta name="author" content="Abhinav Singwal (yogsec)">
  <meta property="og:title" content="People Search · Google Dorks">
  <meta property="og:description" content="Generate powerful Google dorks to search for people using name and clue. OSINT tool for penetration testers & researchers.">
  <meta property="og:type" content="website">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://yogsec.github.io/people-search/">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ... (existing styles) ... */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .card {
      max-width: 820px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 48px;
      padding: 2.5rem 2.8rem;
      box-shadow: 0 25px 50px -10px rgba(0, 20, 30, 0.25),
                  inset 0 1px 2px rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: all 0.2s ease;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .header i {
      font-size: 2.4rem;
      color: #1e3c5c;
      background: rgba(30, 60, 92, 0.08);
      padding: 0.6rem;
      border-radius: 18px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }

    .header h1 {
      font-weight: 700;
      font-size: 2.2rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #0b2a3e, #1f4b6e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header .badge {
      margin-left: auto;
      background: #1e3c5c;
      color: white;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      letter-spacing: 0.3px;
      background: rgba(30, 60, 92, 0.12);
      color: #1e3c5c;
      border: 1px solid rgba(30, 60, 92, 0.15);
      backdrop-filter: blur(4px);
    }

    .sub {
      color: #2c4d6b;
      font-weight: 400;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      padding: 0.5rem 0 0.2rem 0;
      border-bottom: 2px dashed rgba(30, 60, 92, 0.10);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sub i {
      color: #2f648a;
      font-size: 1rem;
      opacity: 0.8;
    }

    .form-group {
      margin-bottom: 1.8rem;
    }

    label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
      font-size: 1rem;
      color: #1a3347;
      margin-bottom: 0.5rem;
    }

    label i {
      color: #2f648a;
      font-size: 1.1rem;
      width: 1.4rem;
      text-align: center;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: white;
      border-radius: 60px;
      padding: 0.1rem 0.1rem 0.1rem 1.5rem;
      box-shadow: 0 4px 12px rgba(0, 20, 30, 0.06), inset 0 1px 3px rgba(0,0,0,0.02);
      border: 1px solid rgba(30, 60, 92, 0.12);
      transition: border 0.2s, box-shadow 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: #1f4b6e;
      box-shadow: 0 6px 18px rgba(26, 67, 113, 0.12);
      background: white;
    }

    .input-wrapper input {
      width: 100%;
      padding: 0.9rem 0.8rem 0.9rem 0.2rem;
      border: none;
      background: transparent;
      font-size: 1rem;
      color: #0b1f2e;
      outline: none;
      font-weight: 450;
    }

    .input-wrapper input::placeholder {
      color: #8ba0b3;
      font-weight: 350;
      letter-spacing: -0.01em;
    }

    .input-wrapper i.fa-arrow-right {
      background: #1e3c5c;
      color: white;
      padding: 0.8rem 1.4rem;
      border-radius: 60px;
      font-size: 1.1rem;
      cursor: default;
      opacity: 0.6;
      transition: 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .input-wrapper i.fa-arrow-right.active {
      opacity: 1;
      background: #0f2d47;
      box-shadow: 0 6px 12px rgba(18, 52, 77, 0.2);
      cursor: pointer;
    }

    .hint {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #3d607c;
      padding-left: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .hint i {
      font-size: 0.7rem;
      opacity: 0.7;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-top: 2.2rem;
      gap: 1rem;
    }

    .dork-preview {
      background: rgba(0, 20, 30, 0.02);
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      border: 1px solid rgba(30, 60, 92, 0.06);
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #1b3c54;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(4px);
      word-break: break-all;
      flex: 1;
      min-width: 200px;
    }

    .dork-preview i {
      margin-right: 8px;
      color: #3e6a8a;
    }

    .btn {
      background: #1a3c57;
      border: none;
      padding: 0.9rem 2.4rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      box-shadow: 0 8px 18px rgba(21, 56, 82, 0.2);
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.1);
      letter-spacing: 0.3px;
    }

    .btn:hover {
      background: #0f2d47;
      transform: scale(1.02);
      box-shadow: 0 12px 24px rgba(18, 52, 77, 0.25);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn i {
      font-size: 1.1rem;
    }

    /* --- FOOTER with social links --- */
    .footer-links {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(30, 60, 92, 0.08);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1.8rem 2.2rem;
    }

    .footer-links a {
      color: #2c4d6b;
      font-size: 1.3rem;
      transition: all 0.2s ease;
      opacity: 0.7;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      background: rgba(255,255,255,0.3);
      padding: 0.4rem 0.9rem 0.4rem 0.7rem;
      border-radius: 40px;
      border: 1px solid rgba(30, 60, 92, 0.04);
      backdrop-filter: blur(2px);
    }

    .footer-links a:hover {
      opacity: 1;
      transform: translateY(-2px);
      color: #0f2d47;
      background: rgba(255,255,255,0.6);
      box-shadow: 0 6px 14px rgba(0, 20, 30, 0.08);
      border-color: rgba(30, 60, 92, 0.12);
    }

    .footer-links a i {
      font-size: 1.2rem;
    }

    .footer-links a .link-label {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      opacity: 0.8;
    }

    /* responsive */
    @media (max-width: 600px) {
      .card {
        padding: 1.8rem 1.2rem;
        border-radius: 32px;
      }
      .header h1 {
        font-size: 1.8rem;
      }
      .action-row {
        flex-direction: column;
        align-items: stretch;
      }
      .btn {
        justify-content: center;
        padding: 0.8rem;
      }
      .dork-preview {
        text-align: center;
        font-size: 0.8rem;
        padding: 0.6rem 0.8rem;
      }
      .input-wrapper {
        padding-left: 1rem;
      }
      .input-wrapper input {
        font-size: 0.95rem;
        padding: 0.8rem 0.5rem 0.8rem 0.1rem;
      }
      .input-wrapper i.fa-arrow-right {
        padding: 0.7rem 1rem;
        font-size: 1rem;
      }
      .footer-links {
        gap: 0.8rem;
      }
      .footer-links a {
        padding: 0.3rem 0.7rem 0.3rem 0.5rem;
        font-size: 1rem;
      }
      .footer-links a .link-label {
        display: none; /* hide labels on small screens */
      }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <i class="fas fa-user-secret"></i>
    <h1>People Search</h1>
    <span class="badge"><i class="fas fa-robot" style="margin-right: 6px;"></i> dork · v1</span>
  </div>
  <div class="sub">
    <i class="fas fa-arrow-trend-up"></i> 
    <span>Build Google dorks on the fly · name + clue</span>
  </div>

  <!-- form -->
  <div class="form-group">
    <label for="nameInput">
      <i class="fas fa-id-badge"></i> Full name
    </label>
    <div class="input-wrapper">
      <input type="text" id="nameInput" placeholder="e.g. Abhinav Singwal" value="Abhinav Singwal">
      <i class="fas fa-arrow-right"></i>
    </div>
    <div class="hint">
      <i class="fas fa-info-circle"></i> Use exact name or variations
    </div>
  </div>

  <div class="form-group">
    <label for="clueInput">
      <i class="fas fa-lightbulb"></i> Clue / info
    </label>
    <div class="input-wrapper">
      <input type="text" id="clueInput" placeholder="e.g. penetration tester, security researcher" value="penetration tester">
      <i class="fas fa-arrow-right"></i>
    </div>
    <div class="hint">
      <i class="fas fa-tag"></i> Any keyword: job, location, interest, company
    </div>
  </div>

  <!-- dork preview & search -->
  <div class="action-row">
    <div class="dork-preview" id="dorkPreview">
      <i class="fas fa-code"></i> 
      <span id="dorkDisplay">site:linkedin.com "Abhinav Singwal" "penetration tester"</span>
    </div>
    <button class="btn" id="searchBtn">
      <i class="fab fa-google"></i> Search with Dork
    </button>
  </div>

  <!-- FOOTER with social links (icons + labels) -->
  <div class="footer-links">
    <a href="https://github.com/yogsec/" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
      <i class="fab fa-github"></i>
      <span class="link-label">GitHub</span>
    </a>
    <a href="https://linktr.ee/abhinavsingwal" target="_blank" rel="noopener noreferrer" aria-label="Linktree">
      <i class="fas fa-tree"></i>
      <span class="link-label">Linktree</span>
    </a>
    <a href="https://www.linkedin.com/in/abhinavsingwal/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
      <i class="fab fa-linkedin-in"></i>
      <span class="link-label">LinkedIn</span>
    </a>
    <a href="https://x.com/yogsec" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
      <i class="fab fa-x-twitter"></i>
      <span class="link-label">X</span>
    </a>
  </div>
</div>

<script>
  (function() {
    // DOM elements
    const nameInput = document.getElementById('nameInput');
    const clueInput = document.getElementById('clueInput');
    const dorkDisplay = document.getElementById('dorkDisplay');
    const searchBtn = document.getElementById('searchBtn');

    // ---- helper: build google dork query ----
    function buildDork(name, clue) {
      const cleanName = name.trim().replace(/\s+/g, ' ');
      const cleanClue = clue.trim().replace(/\s+/g, ' ');

      if (!cleanName && !cleanClue) {
        return 'site:linkedin.com "name" "clue"';
      }

      if (cleanName && cleanClue) {
        return `site:linkedin.com "${cleanName}" "${cleanClue}"`;
      } 
      else if (cleanName && !cleanClue) {
        return `site:linkedin.com "${cleanName}"`;
      } 
      else if (!cleanName && cleanClue) {
        return `site:linkedin.com "${cleanClue}"`;
      }
      return 'site:linkedin.com "name" "clue"';
    }

    // ---- update preview ----
    function updateDorkPreview() {
      const name = nameInput.value;
      const clue = clueInput.value;
      const dork = buildDork(name, clue);
      dorkDisplay.textContent = dork;
    }

    // ---- perform search (google) ----
    function performSearch() {
      const name = nameInput.value;
      const clue = clueInput.value;
      const dork = buildDork(name, clue);
      const encodedDork = encodeURIComponent(dork);
      const googleUrl = `https://www.google.com/search?q=${encodedDork}`;
      window.open(googleUrl, '_blank');
    }

    // ---- event listeners ----
    nameInput.addEventListener('input', updateDorkPreview);
    clueInput.addEventListener('input', updateDorkPreview);

    // initial preview
    updateDorkPreview();

    // search button
    searchBtn.addEventListener('click', performSearch);

    // Enter key on inputs
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        performSearch();
      }
    });
    clueInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        performSearch();
      }
    });

    // Arrow icon active state & click
    const arrowIcons = document.querySelectorAll('.input-wrapper i.fa-arrow-right');
    function updateArrowActive() {
      arrowIcons.forEach(icon => {
        const parentWrapper = icon.closest('.input-wrapper');
        if (parentWrapper) {
          const input = parentWrapper.querySelector('input');
          if (input && input.value.trim().length > 0) {
            icon.classList.add('active');
          } else {
            icon.classList.remove('active');
          }
        }
      });
    }
    nameInput.addEventListener('input', updateArrowActive);
    clueInput.addEventListener('input', updateArrowActive);
    setTimeout(updateArrowActive, 50);

    arrowIcons.forEach(icon => {
      icon.addEventListener('click', () => {
        performSearch();
      });
    });

  })();
</script>
</body>
</html>
